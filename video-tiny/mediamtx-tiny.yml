# ОТДЕЛЬНЫЙ РАЗДАТЧИК ДЛЯ ЛЁГКИХ КОПИЙ КАМЕР (телефон).
#
# ЗАЧЕМ ОТДЕЛЬНО, А НЕ РЯДОМ С ОСТАЛЬНЫМИ ПУТЯМИ. Кабинет на ноутбуке строит
# окна камер по СПИСКУ ПУТЕЙ основного раздатчика. 20.09 лёгкие копии легли
# туда же, и в кабинете стало четыре окна вместо двух — то есть добавка для
# телефона молча переделала рабочий инструмент заказчика. Трогать файл
# кабинета ради этого нельзя, поэтому лёгкие копии живут в своём раздатчике,
# на своих портах: основной их не видит, кабинет остаётся как был.
logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 15s
writeQueueSize: 2048
udpMaxPayloadSize: 1472

api: yes
apiAddress: 127.0.0.1:9994

metrics: no
pprof: no
playback: no

# RTSP не нужен вовсе: лёгкие копии смотрит только браузер телефона, по WebRTC.
rtsp: no

# Приём от конвейеров лёгких копий.
rtmp: yes
rtmpAddress: :1936
rtmpEncryption: "no"

hls: no

webrtc: yes
webrtcAddress: :8890
# ⚠️ webrtcEncryption здесь НЕ ПИШЕМ: поле булево, строка "no" роняет службу.
webrtcLocalUDPAddress: :8190
# Адреса, которые робот называет браузеру как свои. Без них через тайлнет
# картинка чёрная: кандидаты собираются с интерфейсов, а tailscale0 в них нет.
# ⚠️ ВПИШИТЕ СВОИ АДРЕСА: по ним браузер будет забирать картинку. Без них
# через тайлнет окно чёрное — кандидаты собираются с интерфейсов, а
# tailscale0 в них не попадает. Смотреть: tailscale ip -4, ip -4 -br addr
webrtcAdditionalHosts: [100.0.0.0, 192.168.1.10, 192.168.123.18]

srt: no

paths:
  cam_tiny:
  cam2_tiny:

authInternalUsers:
- user: any
  ips: [127.0.0.1, '::1']
  permissions: [{action: publish}, {action: read}, {action: api}, {action: metrics}, {action: pprof}]
- user: any
  ips: [192.168.1.0/24, 192.168.123.0/24, 100.64.0.0/10]   # свои сети и тайлнет
  permissions: [{action: read}]
